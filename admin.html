  <style>
    :root{--bg:#0a0e1a;--surface:#111827;--card:#1a2235;--border:#2a3650;--accent:#f7c948;--green:#22c55e;--red:#ef4444;--text:#e8eaf0;--muted:#6b7280}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;padding:1.5rem}
    h1{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--accent);margin-bottom:1.5rem}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}
    .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1rem}
    .card h3{font-size:.8rem;color:var(--muted);margin-bottom:.5rem;font-weight:600;letter-spacing:.06em}
    .match-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem}
    .match-name{flex:1;font-size:.78rem}
    .match-date{font-size:.65rem;color:var(--muted);display:block}
    input[type=number]{width:44px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:.35rem;border-radius:6px;text-align:center;font-size:.9rem}
    button{background:var(--accent);border:none;color:#000;padding:.4rem .9rem;border-radius:6px;font-weight:700;cursor:pointer;font-size:.8rem}
    button:hover{opacity:.8}
    .saved{color:var(--green);font-size:.75rem;margin-left:.5rem}
    #toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:.5rem 1.25rem;border-radius:20px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s;z-index:999}
    #toast.show{opacity:1}
    #toast.error{background:var(--red)}
    .warning{background:rgba(247,201,72,.1);border:1px solid var(--accent);border-radius:8px;padding:1rem;margin-bottom:1.5rem;font-size:.85rem;line-height:1.6}
    .tabs{display:flex;gap:.5rem;margin-bottom:1.25rem;flex-wrap:wrap}
    .tab-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:.4rem .9rem;border-radius:20px;cursor:pointer;font-size:.8rem;font-weight:600}
    .tab-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}
    .tab-panel{display:none}
    .tab-panel.active{display:block}
  </style>
</head>

let db, fst;

window.addEventListener("firebase-ready", async () => {
  db = window.__db; fst = window.__fst;
  const snap = await fst.getDoc(fst.doc(db, "results", "all"));
  if (snap.exists()) allResults = snap.data() || {};
  renderGrupos();
  renderKnockout();
});

function fmtDate(dt){
  return new Date(dt).toLocaleString("es-AR",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
}

function renderGrupos(){
  const grid = document.getElementById("admin-grid-grupos");
  const byGroup = {};
  GROUP_MATCHES.forEach(m=>{
    if(!byGroup[m.group]) byGroup[m.group]=[];
    byGroup[m.group].push(m);
  });
  grid.innerHTML="";
  Object.entries(byGroup).forEach(([grp,matches])=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`<h3>GRUPO ${grp}</h3>`;
    matches.forEach(m=>card.innerHTML+=matchRowHtml(m));
    grid.appendChild(card);
  });
}

function renderKnockout(){
  const grid = document.getElementById("admin-grid-knockout");
  const byRound = {};
  KNOCKOUT_MATCHES.forEach(m=>{
    if(!byRound[m.round]) byRound[m.round]=[];
    byRound[m.round].push(m);
  });
  grid.innerHTML="";
  Object.entries(byRound).forEach(([round,matches])=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`<h3>${round.toUpperCase()}</h3>`;
    matches.forEach(m=>card.innerHTML+=matchRowHtml(m));
    grid.appendChild(card);
  });
}

function matchRowHtml(m){
  const r=allResults[m.id]||{};
  const isTBD = m.home==="TBD"||m.away==="TBD";
  return `
  <div class="match-row" id="row-${m.id}">
    <span class="match-name">
      ${m.home} vs ${m.away}
      <span class="match-date">${fmtDate(m.datetime)}</span>
    </span>
    <input type="number" id="rh-${m.id}" min="0" max="20" value="${r.home??""}" placeholder="?" ${isTBD?"disabled":""}/>
    <span>–</span>
    <input type="number" id="ra-${m.id}" min="0" max="20" value="${r.away??""}" placeholder="?" ${isTBD?"disabled":""}/>
    <button onclick="saveResult('${m.id}')" ${isTBD?"disabled":""}>✔</button>
    ${r.home!==undefined?`<span class="saved">✓</span>`:""}
  </div>`;
}

async function saveResult(mid){
  const h=parseInt(document.getElementById(`rh-${mid}`).value);
  const a=parseInt(document.getElementById(`ra-${mid}`).value);
  if(isNaN(h)||isNaN(a)){toast("Ingresá ambos valores",true);return;}
  allResults[mid]={home:h,away:a};
  try{
    await fst.setDoc(fst.doc(db,"results","all"),allResults);
    await recalcAll();
    toast("Resultado guardado y puntos recalculados ✔");
    renderGrupos();
    renderKnockout();
  }catch(e){
    console.error(e);
    toast("Error al guardar: "+e.message, true);
  }
}

async function recalcAll(){
  const predsSnap = await fst.getDocs(fst.collection(db,"predictions"));
  const allPreds = {};
  predsSnap.forEach(d=>{allPreds[d.id]=d.data();});

  const usersSnap = await fst.getDocs(fst.collection(db,"users"));
  const pts = {};
  usersSnap.forEach(d=>{pts[d.id]=0;});

  Object.entries(allResults).forEach(([mid,res])=>{
    const match = ALL.find(m=>m.id===mid);
    if(!match) return;
    const pW = match.pointsWinner;
    const pE = match.pointsExact;
    const mp = allPreds[mid]||{};
    Object.entries(mp).forEach(([uid,pred])=>{
      if(!(uid in pts)) pts[uid]=0;
      const rh=res.home, ra=res.away, ph=pred.home, pa=pred.away;
      if(rh===ph && ra===pa){
        pts[uid]+=pW+pE;
      } else {
        const rw = rh>ra?1:ra>rh?-1:0;
        const pw = ph>pa?1:pa>ph?-1:0;
        if(rw===pw) pts[uid]+=pW;
      }
    });
  });

  await Promise.all(Object.entries(pts).map(([uid,p])=>
    fst.setDoc(fst.doc(db,"users",uid),{points:p},{merge:true})
  ));
}

function showTab(tab){
  document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById(`panel-${tab}`).classList.add("active");
  event.target.classList.add("active");
}

let tt;
function toast(m,isError){
  const t=document.getElementById("toast");
  t.textContent=m;
  t.className="show"+(isError?" error":"");
  clearTimeout(tt);
  tt=setTimeout(()=>t.className="",3500);
}
</script>
